name: Native validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP lint
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Publication gate (boundary, contract, disclosure)
        run: php tests/repository-boundary.php
      - name: Elementor schema/save lifecycle
        run: php tests/elementor-schema-save-stage1.php
      - name: Elementor schema/save adversarial gaps (Issue #3)
        run: php tests/elementor-schema-save-gap-repro.php
      - name: Persisted Elementor operation binding (fail-closed)
        run: php tests/elementor-operation-binding.php
      - name: Elementor single-source
        run: php tests/elementor-single-source.php
      - name: WooCommerce stock
        run: php tests/woocommerce-stock-rounding.php
      - name: Option normalization
        run: php tests/option-normalization.php
      - name: Control plane entitlements
        run: php tests/control-plane-entitlements.php

  wordpress-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: installed-compat
            wp: '7.0.6'
            elementor: '4.3.3'
            woo: '11.1.2'
            yoast: '28.6'
          - profile: latest-compat
            wp: latest
            elementor: latest
            woo: latest
            yoast: latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: wp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, curl, sodium
          coverage: none
      - name: Real WordPress + Elementor/WooCommerce/Yoast CAS regression
        env:
          WP_TEST_VERSION: ${{ matrix.wp }}
          ELEMENTOR_TEST_VERSION: ${{ matrix.elementor }}
          WOO_TEST_VERSION: ${{ matrix.woo }}
          YOAST_TEST_VERSION: ${{ matrix.yoast }}
        run: bash tests/wordpress-native-smoke.sh
